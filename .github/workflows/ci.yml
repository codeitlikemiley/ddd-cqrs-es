name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let main runs finish; still cancel superseded PR pushes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup MSRV toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.93.0

      - name: Cache cargo artifacts
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-

      - name: Verify library and CLI compile on MSRV
        run: |
          cargo check --locked --all-targets -p ddd_cqrs_es
          cargo check --locked --all-targets -p ddd-cqrs-es-cli

  wasm-feature-matrix:
    name: wasm32 feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: wasm32-wasip2

      - name: Cache cargo artifacts
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-matrix-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-matrix-

      - name: Compile wasm32-wasip2 feature matrix
        run: |
          set -euo pipefail
          features=(
            "wasm,uuid"
            "wasm,json,uuid"
            "wasi-http,json,uuid,wasm"
            "wasi-neon,wasi-http,json,uuid,wasm"
            "wasi-supabase-rpc,wasi-http,json,uuid,wasm"
            "async,json,redis,wasm"
            "wasi-redis,async,json,redis,wasm"
            "spin-postgres,json,uuid,wasm"
            "spin-redis,async,json,redis,wasm"
          )
          for feature_set in "${features[@]}"; do
            echo "==> checking ${feature_set}"
            cargo check --locked --target wasm32-wasip2 -p ddd_cqrs_es --no-default-features --features "${feature_set}"
          done

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DDD_CQRS_ES_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/ddd_test
      DDD_CQRS_ES_MYSQL_URL: mysql://root:mysql@127.0.0.1:3306/ddd_test
      DDD_CQRS_ES_REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ddd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ddd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: ddd_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install release policy tools
        uses: taiki-e/install-action@d6d752794628f1e1fffa3c4d3c8874e06f043d50 # v2.62.15
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-hack

      - name: Cache cargo artifacts
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Ensure docs script is executable
        run: chmod +x scripts/verify-docs-rust.sh scripts/verify-docs.sh scripts/ci-check.sh scripts/check-fullstack-template-sync.sh scripts/verify-spin-production-manifests.sh

      - name: Run CI quality suite
        run: bash scripts/ci-check.sh

  # `quality` never compiles the fullstack preset, so a template that names a
  # `wasi-auth` API no published version exports reached users unnoticed. This
  # job generates a project on a runner that has no sibling checkout to fall
  # back on, and compiles it for both the server and the browser.
  generated-fullstack:
    name: generated fullstack project
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: wasm32-wasip2, wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fullstack-${{ hashFiles('**/Cargo.lock', 'crates/ddd-cli/templates/fullstack/Cargo.toml.template') }}
          restore-keys: |
            ${{ runner.os }}-fullstack-

      - name: Compile a generated fullstack project
        run: bash scripts/check-generated-fullstack.sh
