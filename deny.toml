[graph]
all-features = true

[advisories]
version = 2
# RUSTSEC-2026-0253 (unsound lru 0.16.x via mysql) is ignored in
# .cargo/audit.toml for cargo-audit; mirror the ignore here so all-features
# graphs do not fail on the unsound advisory.
ignore = ["RUSTSEC-2026-0253"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "LGPL-2.1-or-later",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-git = [
    "https://github.com/codeitlikemiley/spin-rust-sdk",
]

# spin-sdk is pinned to a maintained fork until upstream merges WASI P3 HTTP fixes.
[sources.allow-org]
github = ["codeitlikemiley"]
