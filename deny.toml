[advisories]
version = 2
# RUSTSEC-2026-0253 (unsound lru 0.16.x via mysql) is ignored in
# .cargo/audit.toml for cargo-audit; cargo-deny v2 does not act on unsound
# advisories, so listing it here only triggers advisory-not-detected noise.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "LGPL-2.1-or-later",
    "MIT",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"

# spin-sdk is pinned to a maintained fork until upstream merges WASI P3 HTTP fixes.
[sources.allow-org]
github = ["codeitlikemiley"]
